<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metallica Quiz – Find the Album</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Oswald:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --panel: #161616;
    --border: #2a2a2a;
    --red: #cc0000;
    --red-hot: #ff2200;
    --gold: #c9a84c;
    --gold-dim: #7a6330;
    --white: #f0ede8;
    --grey: #888;
    --correct: #2a7a2a;
    --correct-bright: #44cc44;
    --wrong: #7a1a1a;
    --wrong-bright: #ff3333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(-65deg, transparent, transparent 80px, rgba(180,0,0,0.018) 80px, rgba(180,0,0,0.018) 82px);
    pointer-events: none;
  }

  .wrapper {
    width: 100%;
    max-width: 780px;
    padding: 20px;
    position: relative;
  }

  /* ── SHARED ── */
  .metallica-logo {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
    margin: 0 auto 6px;
    filter: drop-shadow(0 0 28px rgba(200,0,0,0.5));
  }
  .quiz-subtitle {
    font-family: 'Metal Mania', cursive;
    font-size: clamp(18px, 3.5vw, 28px);
    color: var(--red);
    letter-spacing: 14px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255,0,0,0.4);
    margin-bottom: 4px;
    text-align: center;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), var(--gold), var(--red), transparent);
    margin: 24px 0;
  }

  /* ── INTRO ── */
  #intro-screen { text-align: center; animation: fadeIn 0.8s ease forwards; }

  .logo-area { margin-bottom: 28px; }

  .intro-desc {
    font-size: 15px;
    color: var(--grey);
    letter-spacing: 1px;
    font-weight: 300;
    margin-bottom: 28px;
    line-height: 1.7;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }
  .intro-desc strong { color: var(--gold); font-weight: 600; }

  /* Name input */
  .name-row {
    display: flex;
    gap: 0;
    max-width: 400px;
    margin: 0 auto 28px;
    position: relative;
  }
  .name-input {
    flex: 1;
    background: var(--dark);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input::placeholder { color: #444; letter-spacing: 2px; }
  .name-input:focus { border-color: var(--gold-dim); }

  .btn-start {
    background: linear-gradient(135deg, var(--red) 0%, #880000 100%);
    color: var(--white);
    border: none;
    font-family: 'Metal Mania', cursive;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 14px 30px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-start:hover {
    background: linear-gradient(135deg, var(--red-hot) 0%, var(--red) 100%);
    box-shadow: 0 6px 24px rgba(200,0,0,0.5);
  }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* Leaderboard on intro */
  .lb-preview-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
    text-align: center;
  }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .lb-table th {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold-dim);
    text-transform: uppercase;
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .lb-table th:last-child, .lb-table td:last-child { text-align: right; }
  .lb-table td {
    padding: 10px 10px;
    border-bottom: 1px solid #1a1a1a;
    color: var(--white);
    letter-spacing: 0.5px;
  }
  .lb-table tr:hover td { background: rgba(255,255,255,0.02); }
  .lb-rank { font-family: 'Share Tech Mono', monospace; color: var(--gold-dim); font-size: 11px; width: 32px; }
  .lb-rank-1 { color: #FFD700; }
  .lb-rank-2 { color: #C0C0C0; }
  .lb-rank-3 { color: #cd7f32; }
  .lb-name { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-family: 'Share Tech Mono', monospace; color: var(--gold); font-size: 13px; }
  .lb-time { font-family: 'Share Tech Mono', monospace; color: var(--grey); font-size: 12px; }
  .lb-date { font-family: 'Share Tech Mono', monospace; color: #444; font-size: 11px; }
  .lb-you td { background: rgba(201,168,76,0.06) !important; }
  .lb-you .lb-name::after { content: ' ★'; color: var(--gold); font-size: 10px; }
  .lb-empty { text-align: center; padding: 24px; color: #444; font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px; }

  .btn-clear-lb {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #444;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 6px 14px;
    cursor: pointer;
    margin-top: 12px;
    float: right;
    transition: all 0.2s;
  }
  .btn-clear-lb:hover { color: var(--wrong-bright); border-color: var(--wrong-bright); }

  /* ── GAME SCREEN ── */
  #game-screen { display: none; }

  .game-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    white-space: nowrap;
    min-width: 90px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    transition: width 0.5s ease;
    width: 0%;
  }
  .score-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--grey);
    white-space: nowrap;
  }
  .score-badge span { color: var(--gold); font-weight: 700; }

  .timer-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 58px;
    text-align: right;
  }
  .timer-badge span { color: var(--white); }

  .question-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--red);
    padding: 36px 40px 40px;
    position: relative;
    animation: slideUp 0.35s ease forwards;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: -3px; left: 40px;
    width: 60px; height: 3px;
    background: var(--gold);
  }
  .q-number {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--red);
    margin-bottom: 10px;
  }
  .q-instruction {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--grey);
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 300;
  }
  .song-name {
    font-family: 'Metal Mania', cursive;
    font-size: clamp(22px, 4vw, 36px);
    color: var(--white);
    text-shadow: 0 0 20px rgba(200,150,0,0.3);
    margin-bottom: 36px;
    line-height: 1.2;
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .options-grid { grid-template-columns: 1fr; }
    .question-card { padding: 24px 20px 28px; }
  }
  .option-btn {
    background: var(--dark);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 1px;
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s;
    overflow: hidden;
    line-height: 1.3;
  }
  .option-btn .opt-letter {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    background: var(--border);
    color: var(--gold);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    margin-right: 10px;
    flex-shrink: 0;
    transition: background 0.18s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--gold-dim); background: #1e1e1e; transform: translateX(4px); }
  .option-btn:hover:not(:disabled) .opt-letter { background: var(--gold-dim); color: var(--black); }
  .option-btn:disabled { cursor: default; transform: none !important; }
  .option-btn.correct { border-color: var(--correct-bright); background: rgba(42,122,42,0.2); color: var(--correct-bright); }
  .option-btn.correct .opt-letter { background: var(--correct); color: #fff; }
  .option-btn.wrong { border-color: var(--wrong-bright); background: rgba(122,26,26,0.2); color: var(--wrong-bright); }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }
  .option-btn.reveal { border-color: var(--correct-bright); background: rgba(42,122,42,0.1); color: var(--correct-bright); animation: pulse-green 0.5s ease; }
  .option-btn.reveal .opt-letter { background: var(--correct); color: #fff; }

  .feedback-row {
    margin-top: 24px;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .feedback-msg { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
  .feedback-msg.show { opacity: 1; }
  .feedback-msg.good { color: var(--correct-bright); }
  .feedback-msg.bad { color: var(--wrong-bright); }
  .btn-next {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 10px 28px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }
  .btn-next.visible { opacity: 1; pointer-events: all; }
  .btn-next:hover { background: var(--gold-dim); color: var(--black); }

  /* ── RESULTS ── */
  #results-screen { display: none; animation: fadeIn 0.6s ease forwards; }

  .results-header { text-align: center; margin-bottom: 32px; }
  .results-title { font-family: 'Metal Mania', cursive; font-size: clamp(28px, 5vw, 50px); color: var(--white); text-shadow: 0 0 30px rgba(200,0,0,0.4); margin-bottom: 10px; }

  .results-meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  .score-circle {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: radial-gradient(circle, rgba(201,168,76,0.1), transparent);
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.2);
  }
  .score-num { font-family: 'Metal Mania', cursive; font-size: 42px; color: var(--gold); line-height: 1; }
  .score-denom { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--grey); letter-spacing: 2px; }

  .time-circle {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 3px solid var(--border);
    background: radial-gradient(circle, rgba(255,255,255,0.03), transparent);
    position: relative;
  }
  .time-num { font-family: 'Metal Mania', cursive; font-size: 30px; color: var(--white); line-height: 1.1; }
  .time-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--grey); letter-spacing: 3px; margin-top: 2px; }

  .verdict { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; font-weight: 300; color: var(--grey); margin-top: 8px; }
  .result-player-name { font-family: 'Metal Mania', cursive; font-size: 22px; color: var(--gold); letter-spacing: 3px; margin-bottom: 4px; }

  /* Leaderboard on results */
  .lb-section { margin-bottom: 28px; }
  .lb-section-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .summary-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .summary-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid transparent;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 12px;
    align-items: start;
    animation: slideUp 0.3s ease both;
  }
  .summary-item.correct-item { border-left-color: var(--correct-bright); }
  .summary-item.wrong-item { border-left-color: var(--wrong-bright); }
  .summary-icon { font-size: 16px; line-height: 1.5; }
  .summary-song { font-size: 14px; font-weight: 600; color: var(--white); letter-spacing: 1px; margin-bottom: 3px; }
  .summary-detail { font-size: 12px; font-weight: 300; letter-spacing: 1px; color: var(--grey); }
  .summary-detail .correct-ans { color: var(--correct-bright); }
  .summary-detail .wrong-ans { color: var(--wrong-bright); text-decoration: line-through; margin-right: 6px; }
  .summary-num { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--border); margin-top: 2px; }

  .results-buttons { display: flex; gap: 12px; }
  .btn-restart {
    flex: 1;
    background: linear-gradient(135deg, var(--red) 0%, #880000 100%);
    color: var(--white);
    border: none;
    font-family: 'Metal Mania', cursive;
    font-size: 20px;
    letter-spacing: 4px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }
  .btn-restart:hover { background: linear-gradient(135deg, var(--red-hot), var(--red)); box-shadow: 0 6px 24px rgba(200,0,0,0.4); }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(68,204,68,0.4); } 100% { box-shadow: 0 0 0 12px rgba(68,204,68,0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .shake { animation: shake 0.35s ease; }
</style>
</head>

<script>
// ── DATA ──
const DATA = {
  "Kill 'Em All": ["Hit the Lights","The Four Horsemen","Motorbreath","Jump in the Fire","(Anesthesia) - Pulling Teeth","Whiplash","Phantom Lord","No Remorse","Seek & Destroy","Metal Militia"],

  "Master of Puppets": ["Battery","Master of Puppets","The Thing That Should Not Be","Welcome Home (Sanitarium)","Disposable Heroes","Leper Messiah","Orion","Damage, Inc."],
  "...And Justice for All": ["Blackened","...And Justice for All","Eye of the Beholder","One","The Shortest Straw","Harvester of Sorrow","The Frayed Ends of Sanity","To Live Is to Die","Dyers Eve"],
  "Metallica (The Black Album)": ["Enter Sandman","Sad But True","Holier Than Thou","The Unforgiven","Wherever I May Roam","Don't Tread on Me","Through the Never","Nothing Else Matters","Of Wolf and Man","The God That Failed","My Friend of Misery","The Struggle Within"],
  "Load": ["Ain't My Bitch","2 X 4","The House Jack Built","Until It Sleeps","King Nothing","Hero of the Day","Bleeding Me","Cure","Poor Twisted Me","Wasting My Hate","Mama Said","Thorn Within","Ronnie","The Outlaw Torn"],
  "ReLoad": ["Fuel","The Memory Remains","Devil's Dance","The Unforgiven II","Better Than You","Slither","Carpe Diem Baby","Bad Seed","Where the Wild Things Are","Prince Charming","Low Man's Lyric","Attitude","Fixxxer"],
  "St. Anger": ["Frantic","St. Anger","Some Kind of Monster","Dirty Window","Invisible Kid","My World","Shoot Me Again","Sweet Amber","The Unnamed Feeling","Purify","All Within My Hands"],
  "Death Magnetic": ["That Was Just Your Life","The End of the Line","Broken, Beat & Scarred","The Day That Never Comes","All Nightmare Long","Cyanide","The Unforgiven III","The Judas Kiss","Suicide & Redemption","My Apocalypse"],
  "Hardwired... to Self-Destruct": ["Hardwired","Atlas, Rise!","Now That We're Dead","Moth Into Flame","Dream No More","Halo on Fire","Confusion","ManUNkind","Here Comes Revenge","Am I Savage?","Murder One","Spit Out the Bone"],
  "72 Seasons": ["72 Seasons","Shadows Follow","Screaming Suicide","Sleepwalk My Life Away","You Must Burn!","Lux Æterna","Crown of Barbed Wire","Chasing Light","If Darkness Had a Son","Too Far Gone?","Room of Mirrors","Inamorata"]
};
const ALBUMS = Object.keys(DATA);
const LETTERS = ['A','B','C','D'];
const LB_KEY = 'metallica_quiz_leaderboard';

// ── STATE ──
let playerName = '';
let questions = [];
let currentQ = 0;
let score = 0;
let answered = false;
let results = [];
let timerInterval = null;
let startTime = 0;
let elapsedSeconds = 0;

// ── LEADERBOARD STORAGE (localStorage) ──
function loadLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem(LB_KEY) || '[]');
  } catch(e) { return []; }
}
function saveLeaderboard(lb) {
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
}
function addToLeaderboard(name, score, seconds) {
  const lb = loadLeaderboard();
  lb.push({ name, score, seconds, date: new Date().toLocaleDateString() });
  // Sort: higher score first; on tie, lower time first
  lb.sort((a, b) => b.score - a.score || a.seconds - b.seconds);
  // Keep top 20
  saveLeaderboard(lb.slice(0, 20));
  return lb.slice(0, 20);
}
function clearLeaderboard() {
  localStorage.removeItem(LB_KEY);
  renderIntroLB();
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + String(s).padStart(2,'0');
}

// ── RENDER LEADERBOARD TABLE ──
function renderLBTable(lb, highlightName, container) {
  if (!lb.length) {
    container.innerHTML = '<div class="lb-empty">NO ENTRIES YET — BE THE FIRST</div>';
    return;
  }
  let rows = '';
  lb.forEach((e, i) => {
    const rankClass = i === 0 ? 'lb-rank-1' : i === 1 ? 'lb-rank-2' : i === 2 ? 'lb-rank-3' : '';
    const rankSymbol = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#'+(i+1);
    const youClass = (e.name === highlightName) ? 'lb-you' : '';
    rows += `<tr class="${youClass}">
      <td class="lb-rank ${rankClass}">${rankSymbol}</td>
      <td class="lb-name">${escHtml(e.name)}</td>
      <td class="lb-score">${e.score}/10</td>
      <td class="lb-time">${formatTime(e.seconds)}</td>
      <td class="lb-date">${e.date}</td>
    </tr>`;
  });
  container.innerHTML = `<table class="lb-table">
    <thead><tr>
      <th>#</th><th>Name</th><th>Score</th><th>Time</th><th>Date</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderIntroLB() {
  const lb = loadLeaderboard();
  const el = document.getElementById('intro-lb');
  if (!lb.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="lb-preview-title">⚡ Hall of Fame ⚡</div><div id="intro-lb-table"></div><button class="btn-clear-lb" onclick="clearLeaderboard()">CLEAR</button>';
  renderLBTable(lb, '', document.getElementById('intro-lb-table'));
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INTRO INTERACTION ──
function onNameInput() {
  playerName = document.getElementById('player-name').value.trim();
  document.getElementById('btn-start').disabled = playerName.length < 1;
}
function onNameKey(e) {
  if (e.key === 'Enter' && playerName.length > 0) startGame();
}

// ── TIMER ──
function startTimer() {
  startTime = Date.now();
  elapsedSeconds = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timer-display').textContent = formatTime(elapsedSeconds);
  }, 500);
}
function stopTimer() {
  clearInterval(timerInterval);
  elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
}

// ── GAME FLOW ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateQuestions() {
  let pool = [];
  ALBUMS.forEach(album => {
    DATA[album].forEach(song => {
      if (song.trim().toLowerCase() !== album.trim().toLowerCase()) {
        pool.push({ song, album });
      }
    });
  });
  pool = shuffle(pool);
  return pool.slice(0, 10).map(({ song, album }) => {
    let wrongAlbums;
    if (album === 'Load' || album === 'ReLoad') {
      const sibling = album === 'Load' ? 'ReLoad' : 'Load';
      const others = shuffle(ALBUMS.filter(a => a !== album && a !== sibling)).slice(0, 2);
      wrongAlbums = [sibling, ...others];
    } else {
      wrongAlbums = shuffle(ALBUMS.filter(a => a !== album)).slice(0, 3);
    }
    return { song, correctAlbum: album, options: shuffle([album, ...wrongAlbums]) };
  });
}

function goIntro() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('intro-screen').style.display = '';
  renderIntroLB();
}

function startGame() {
  playerName = document.getElementById('player-name').value.trim();
  if (!playerName) return;
  questions = generateQuestions();
  currentQ = 0;
  score = 0;
  results = [];
  answered = false;

  document.getElementById('intro-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';

  startTimer();
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[currentQ];

  document.getElementById('progress-label').textContent = `Question ${currentQ + 1} / 10`;
  document.getElementById('progress-fill').style.width = `${(currentQ / 10) * 100}%`;
  document.getElementById('score-display').textContent = score;
  document.getElementById('q-number').textContent = `— ${String(currentQ + 1).padStart(2, '0')} —`;
  document.getElementById('song-name').textContent = q.song;

  const feedback = document.getElementById('feedback-msg');
  feedback.textContent = '';
  feedback.className = 'feedback-msg';

  const btnNext = document.getElementById('btn-next');
  btnNext.className = 'btn-next';
  btnNext.textContent = currentQ < 9 ? 'Next ›' : 'See Results ›';

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i, opt === q.correctAlbum, q.correctAlbum, opt);
    grid.appendChild(btn);
  });

  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideUp 0.35s ease forwards';
}

function selectAnswer(idx, isCorrect, correctAlbum, chosen) {
  if (answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.option-btn');
  const feedback = document.getElementById('feedback-msg');
  buttons.forEach(b => b.disabled = true);
  if (isCorrect) {
    buttons[idx].classList.add('correct');
    score++;
    document.getElementById('score-display').textContent = score;
    feedback.textContent = '✔ Correct!';
    feedback.className = 'feedback-msg good show';
  } else {
    buttons[idx].classList.add('wrong');
    buttons[idx].classList.add('shake');
    feedback.textContent = '✘ Wrong!';
    feedback.className = 'feedback-msg bad show';
    buttons.forEach(b => {
      if (b.textContent.replace(/^[A-D]/, '').trim() === correctAlbum) b.classList.add('reveal');
    });
  }
  results.push({ song: questions[currentQ].song, correct: isCorrect, correctAlbum, chosenAlbum: isCorrect ? null : chosen });
  document.getElementById('btn-next').className = 'btn-next visible';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= 10) showResults();
  else renderQuestion();
}

function showResults() {
  stopTimer();
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';

  // Save to leaderboard
  const lb = addToLeaderboard(playerName, score, elapsedSeconds);

  // Player name + score display
  document.getElementById('result-player-name').textContent = playerName.toUpperCase();
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-time').textContent = formatTime(elapsedSeconds);

  const verdicts = [[0,2,'You Need a Refresher'],[3,4,'Just a Fan'],[5,6,'Headbanger'],[7,8,'True Metalhead'],[9,9,'Master of Puppets'],[10,10,'⚡ Metallica Deity ⚡']];
  const v = verdicts.find(([mn, mx]) => score >= mn && score <= mx);
  document.getElementById('verdict').textContent = v ? v[2] : '';

  const titles = ['Brutal...', 'Not Bad.', 'Solid.', 'Impressive!', '⚡ Legendary! ⚡'];
  document.getElementById('results-title').textContent = score <= 3 ? titles[0] : score <= 5 ? titles[1] : score <= 7 ? titles[2] : score <= 9 ? titles[3] : titles[4];

  // Progress bar full
  document.getElementById('progress-fill').style.width = '100%';

  // Render leaderboard
  const lbEl = document.getElementById('results-lb');
  renderLBTable(lb, playerName, lbEl);

  // Render question summary
  const list = document.getElementById('summary-list');
  list.innerHTML = '';
  results.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = `summary-item ${r.correct ? 'correct-item' : 'wrong-item'}`;
    item.style.animationDelay = `${i * 0.06}s`;
    const detailHtml = r.correct
      ? `<span class="correct-ans">✔ ${r.correctAlbum}</span>`
      : `<span class="wrong-ans">${r.chosenAlbum}</span> → <span class="correct-ans">${r.correctAlbum}</span>`;
    item.innerHTML = `<div class="summary-icon">${r.correct ? '✔' : '✘'}</div><div><div class="summary-song">${r.song}</div><div class="summary-detail">${detailHtml}</div></div><div class="summary-num">${String(i+1).padStart(2,'0')}</div>`;
    list.appendChild(item);
  });
}

// ── INIT ──
renderIntroLB();
</script>
